[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/.netlify/functions/cron-sync-results"
  to = "/api/cron/sync-results"
  status = 200
